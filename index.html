<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpeakSmart</title>
</head>
<body>
  <script>
    // =====================================================
    // Shared API helper + UI helpers
    // =====================================================
    async function aiGenerate(type, topic = "") {
      const res = await fetch("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type, topic })
      });

      if (!res.ok) {
        const err = new Error(`API error ${res.status}`);
        err.status = res.status;
        err.retryAfterMs = parseRetryAfterMs(res);
        throw err;
      }

      const payload = await res.json();
      if (!payload?.ok || !payload?.data) {
        const err = new Error("Invalid API payload");
        err.status = 500;
        throw err;
      }
      return payload;
    }

    function showEl(id) {
      const el = document.getElementById(id);
      if (el) el.style.display = "";
    }

    function setText(id, value) {
      const el = document.getElementById(id);
      if (el) el.textContent = value ?? "";
    }

    // =====================================================
    // Lightweight toast messages
    // =====================================================
    (function ensureToastHost() {
      if (document.getElementById("toastHost")) return;
      const host = document.createElement("div");
      host.id = "toastHost";
      host.setAttribute("aria-live", "polite");
      host.style.position = "fixed";
      host.style.right = "16px";
      host.style.bottom = "16px";
      host.style.zIndex = "9999";
      host.style.display = "flex";
      host.style.flexDirection = "column";
      host.style.gap = "8px";
      document.body.appendChild(host);
    })();

    function showToast(message, type = "info", ms = 1800) {
      const host = document.getElementById("toastHost");
      if (!host) return;

      const t = document.createElement("div");
      t.textContent = message;
      t.style.padding = "10px 12px";
      t.style.borderRadius = "10px";
      t.style.fontSize = "14px";
      t.style.boxShadow = "0 6px 18px rgba(0,0,0,.15)";
      t.style.background = "#1f2937";
      t.style.color = "#fff";
      t.style.opacity = "0";
      t.style.transform = "translateY(6px)";
      t.style.transition = "all .18s ease";

      if (type === "success") t.style.background = "#166534";
      if (type === "warn") t.style.background = "#92400e";
      if (type === "error") t.style.background = "#991b1b";

      host.appendChild(t);
      requestAnimationFrame(() => {
        t.style.opacity = "1";
        t.style.transform = "translateY(0)";
      });

      setTimeout(() => {
        t.style.opacity = "0";
        t.style.transform = "translateY(6px)";
        setTimeout(() => t.remove(), 180);
      }, ms);
    }

    // =====================================================
    // Rate limiting + retry/backoff
    // =====================================================
    const RL_MIN_INTERVAL_MS = 1500;
    const RL_COOLDOWN_MS = 1200;
    const RETRY_MAX_ATTEMPTS = 3;
    const RETRY_BASE_MS = 400;

    const _rlState = new Map();
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

    function parseRetryAfterMs(response) {
      const h = response?.headers?.get?.("Retry-After");
      if (!h) return null;

      const seconds = Number(h);
      if (!Number.isNaN(seconds) && seconds >= 0) return Math.round(seconds * 1000);

      const at = Date.parse(h);
      if (!Number.isNaN(at)) {
        const ms = at - Date.now();
        return ms > 0 ? ms : 0;
      }
      return null;
    }

    function _now() { return Date.now(); }

    function _getState(key) {
      if (!_rlState.has(key)) {
        _rlState.set(key, { lastAt: 0, inFlight: false, cooldownUntil: 0 });
      }
      return _rlState.get(key);
    }

    function _remainingCooldownMs(key) {
      const s = _getState(key);
      return Math.max(0, s.cooldownUntil - _now());
    }

    function _setButtonBusy(btn, labelBusy = "Generating...") {
      if (!btn) return;
      if (!btn.dataset.origText) btn.dataset.origText = btn.textContent;
      btn.disabled = true;
      btn.textContent = labelBusy;
    }

    function _restoreButton(btn) {
      if (!btn) return;
      btn.disabled = false;
      btn.textContent = btn.dataset.origText || btn.textContent;
    }

    function _setButtonCooldown(btn, ms) {
      if (!btn) return;
      const orig = btn.dataset.origText || btn.textContent;
      const end = _now() + ms;
      btn.disabled = true;

      const tick = () => {
        const left = Math.max(0, end - _now());
        if (left <= 0) {
          btn.disabled = false;
          btn.textContent = orig;
          return;
        }
        btn.textContent = `${orig} (${Math.ceil(left / 1000)}s)`;
        requestAnimationFrame(tick);
      };
      tick();
    }

    async function withRetry(fn, opts = {}) {
      const maxAttempts = opts.maxAttempts ?? RETRY_MAX_ATTEMPTS;
      const baseMs = opts.baseMs ?? RETRY_BASE_MS;
      const maxDelayMs = opts.maxDelayMs ?? 15000;

      let lastErr;
      for (let attempt = 1; attempt <= maxAttempts; attempt++) {
        try {
          return await fn();
        } catch (err) {
          lastErr = err;
          if (attempt >= maxAttempts) break;

          const status = err?.status;
          const transient = [429, 500, 502, 503, 504].includes(status) ||
            String(err?.message || "").includes("Failed to fetch") ||
            String(err?.message || "").includes("NetworkError");

          if (!transient) break;

          let delay;
          if (status === 429 && Number.isFinite(err?.retryAfterMs)) {
            delay = err.retryAfterMs;
          } else {
            const jitter = Math.floor(Math.random() * 150);
            delay = baseMs * Math.pow(2, attempt - 1) + jitter;
          }

          delay = Math.max(100, Math.min(delay, maxDelayMs));
          showToast("Retrying…", "info", 1000);
          await sleep(delay);
        }
      }
      throw lastErr;
    }

    async function runGuardedAction({ key, btn, busyLabel = "Generating...", run }) {
      const s = _getState(key);
      const now = _now();

      if (s.inFlight) {
        showToast("Please wait…", "warn", 1200);
        return { blocked: true, reason: "in_flight" };
      }

      if (now - s.lastAt < RL_MIN_INTERVAL_MS) {
        showToast("Please wait…", "warn", 1200);
        const wait = RL_MIN_INTERVAL_MS - (now - s.lastAt);
        if (btn) _setButtonCooldown(btn, Math.min(wait, RL_COOLDOWN_MS));
        return { blocked: true, reason: "rate_limited" };
      }

      const remain = _remainingCooldownMs(key);
      if (remain > 0) {
        showToast("Please wait…", "warn", 1200);
        if (btn) _setButtonCooldown(btn, Math.min(remain, RL_COOLDOWN_MS));
        return { blocked: true, reason: "cooldown" };
      }

      s.inFlight = true;
      s.lastAt = now;
      s.cooldownUntil = now + RL_COOLDOWN_MS;
      _setButtonBusy(btn, busyLabel);

      try {
        const out = await withRetry(run);
        return { blocked: false, result: out };
      } finally {
        s.inFlight = false;
        const remaining = _remainingCooldownMs(key);
        if (btn && remaining > 0) {
          _setButtonCooldown(btn, remaining);
        } else {
          _restoreButton(btn);
        }
      }
    }

    // =====================================================
    // Generators (wired to existing ids)
    // =====================================================
    let selectedQuoteTopic = "public speaking";

    function pickQuoteTopic(btn) {
      const row = document.getElementById("quoteTopicRow");
      if (row) row.querySelectorAll(".pill").forEach((p) => p.classList.remove("active"));
      btn.classList.add("active");
      selectedQuoteTopic = btn.dataset.qtopic || "public speaking";
    }

    async function genTopic() {
      const btn = document.querySelector("#p2 .btn");
      const guard = await runGuardedAction({ key: "topic", btn, run: async () => aiGenerate("topic") });
      if (guard.blocked) return;
      try {
        const { data, source } = guard.result;
        setText("topicText", data.text || "Describe a lesson learned from teamwork.");
        showEl("topicCard");
        if (source !== "gemini") showToast("Using safe fallback", "warn", 1800);
      } catch {
        setText("topicText", "Describe a lesson learned from teamwork.");
        showEl("topicCard");
      }
    }

    async function genWord() {
      const btn = document.querySelector("#p3 .btn");
      const guard = await runGuardedAction({ key: "word", btn, run: async () => aiGenerate("word") });
      if (guard.blocked) return;
      try {
        const { data, source } = guard.result;
        setText("wWord", data.word || "Articulate");
        setText("wPron", data.pronunciation || "ar-TIK-yuh-lit");
        setText("wDef", data.definition || "Able to express ideas clearly.");
        setText("wEx", data.example || "She gave an articulate project update.");
        showEl("wordCard");
        if (source !== "gemini") showToast("Using safe fallback", "warn", 1800);
      } catch {
        setText("wWord", "Articulate");
        setText("wPron", "ar-TIK-yuh-lit");
        setText("wDef", "Able to express ideas clearly.");
        setText("wEx", "She gave an articulate project update.");
        showEl("wordCard");
      }
    }

    async function genJoke() {
      const btn = document.querySelector("#p4 .btn");
      const guard = await runGuardedAction({ key: "joke", btn, run: async () => aiGenerate("joke") });
      if (guard.blocked) return;
      try {
        const { data, source } = guard.result;
        setText("jokeText", data.text || "Why did the speaker bring a pencil? To draw attention.");
        showEl("jokeCard");
        if (source !== "gemini") showToast("Using safe fallback", "warn", 1800);
      } catch {
        setText("jokeText", "Why did the speaker bring a pencil? To draw attention.");
        showEl("jokeCard");
      }
    }

    async function genQuote() {
      const btn = document.querySelector("#p5 .btn");
      const guard = await runGuardedAction({ key: "quote", btn, run: async () => aiGenerate("quote", selectedQuoteTopic) });
      if (guard.blocked) return;
      try {
        const { data, source } = guard.result;
        setText("quoteText", data.text || "Small consistent effort builds speaking confidence.");
        setText("quoteAuthor", data.author ? `— ${data.author}` : "— Unknown");
        showEl("quoteCard");
        if (source !== "gemini") showToast("Using safe fallback", "warn", 1800);
      } catch {
        setText("quoteText", "Small consistent effort builds speaking confidence.");
        setText("quoteAuthor", "— Unknown");
        showEl("quoteCard");
      }
    }

    async function genSpeechTitle() {
      const btn = document.querySelector("#p6 .btn");
      const guard = await runGuardedAction({ key: "speechTitle", btn, run: async () => aiGenerate("speechTitle") });
      if (guard.blocked) return;
      try {
        const { data, source } = guard.result;
        setText("speechTitleText", data.text || "Speak with Clarity: Turning Ideas into Impact");
        showEl("speechTitleCard");
        if (source !== "gemini") showToast("Using safe fallback", "warn", 1800);
      } catch {
        setText("speechTitleText", "Speak with Clarity: Turning Ideas into Impact");
        showEl("speechTitleCard");
      }
    }
  </script>
</body>
</html>
